
name: Sportradar API - tulostaulukko

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testaa:
    runs-on: ubuntu-latest

    steps:
      - name: Hae DP World Tour Championship tulokset
        env:
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import sys

          key = os.environ.get("SPORTRADAR_API_KEY")
          if not key:
              sys.exit("API-avain puuttuu")

          tournament_id = (
              "5cb4d159-8ee1-4239-b8cc-de4746e6d1d0"
          )

          url = (
              "https://api.sportradar.com/golf/"
              "trial/euro/v3/en/2026/tournaments/"
              f"{tournament_id}/leaderboard.json"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "x-api-key": key,
                  "accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  data = json.load(response)

              tournament = data.get("tournament", {})
              leaderboard = data.get("leaderboard", {})

              if isinstance(leaderboard, dict):
                  players = leaderboard.get("players", [])
                  if not players:
                      players = leaderboard.get("player", [])
              elif isinstance(leaderboard, list):
                  players = leaderboard
              else:
                  players = []

              print("HTTP 200 - tulostaulukko vastaanotettu")
              print("Kilpailu:", tournament.get("name"))
              print("Tila:", tournament.get("status"))
              print("Pelaajia:", len(players))
              print("JSON-juuren kentat:", list(data.keys()))
              print("Tulostaulukon tyyppi:",
                    type(leaderboard).__name__)

              if isinstance(leaderboard, dict):
                  print("Tulostaulukon kentat:",
                        list(leaderboard.keys()))

              if not players:
                  sys.exit(
                      "Pelaajalistaa ei loytynyt "
                      "odotetusta rakenteesta"
                  )

              for player in players:
                  first = player.get("first_name", "")
                  last = player.get("last_name", "")
                  name = player.get("name") or (
                      first + " " + last
                  ).strip()

                  print(
                      "PELAAJA:",
                      name,
                      "| sija:", player.get("position"),
                      "| tulos:", player.get("score"),
                      "| lyonnit:", player.get("strokes")
                  )

              lindell = [
                  p for p in players
                  if "lindell" in (
                      str(p.get("last_name", "")) + " " +
                      str(p.get("name", ""))
                  ).lower()
              ]

              if not lindell:
                  sys.exit(
                      "Oliver Lindellia ei loytynyt "
                      "pelaajalistasta"
                  )

              print("OK - Oliver Lindell loytyi!")

          except urllib.error.HTTPError as error:
              print("HTTP-virhe:", error.code)
              sys.exit(1)
          except Exception as error:
              print(
                  "Virhe:",
                  type(error).__name__,
                  str(error)
              )
              sys.exit(1)
          PY
