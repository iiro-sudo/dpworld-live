
name: DP World Tour - tulostarkistus

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  tarkista:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Tarkista Eurosportin tuloslähde
        run: |
          python3 - <<'PY'
          import urllib.request
          import re
          import sys

          url = (
              "https://www.eurosport.es/golf/"
              "dp-world-tour-championship/2026/"
              "live-3a-ronda_mtc20045412/live-table.shtml"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "text/html"
              }
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=20
              ) as response:
                  html = response.read().decode(
                      "utf-8", errors="replace"
                  )
                  print("HTTP:", response.status)
                  print("HTML-merkkejä:", len(html))

              names = [
                  "Lindell", "Hatton", "Perez",
                  "Lindberg", "Chacarra"
              ]

              found = [
                  name for name in names
                  if re.search(name, html, re.I)
              ]

              print("Löytyneet nimet:", found)

              if len(found) < 4:
                  print(
                      "Lähdettä ei voitu vahvistaa. "
                      "Tuloksia ei päivitetä."
                  )
                  sys.exit(1)

              print(
                  "Yhteys toimii, mutta tulostaulukon "
                  "rakenteen tarkistus tarvitaan vielä."
              )

          except Exception as error:
              print("Tiedonhaku epäonnistui:", error)
              sys.exit(1)
          PY
