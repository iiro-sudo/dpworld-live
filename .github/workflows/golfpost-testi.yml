
name: Golf Post - tuloslahteen testi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testaa:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Testaa Golf Postin tulostaulukko
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.error
          import re
          import sys

          url = (
              "https://www.golfpost.com/tournaments/"
              "dp-world-tour-dp-world-tour-championship-2026/"
              "leaderboard/"
          )

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "text/html",
              }
          )

          try:
              with urllib.request.urlopen(
                  req, timeout=25
              ) as response:
                  html = response.read().decode(
                      "utf-8", errors="replace"
                  )
                  print("HTTP:", response.status)
                  print("HTML-merkkien maara:", len(html))

              names = [
                  "Tyrrell Hatton",
                  "Victor Perez",
                  "Mikael Lindberg",
                  "Oliver Lindell",
                  "Joe Dean",
              ]

              found = [
                  name for name in names
                  if name.lower() in html.lower()
              ]

              print("Loytyneet pelaajat:", found)

              if len(found) < 5:
                  print(
                      "Tulostaulukkoa ei voitu vahvistaa."
                  )
                  sys.exit(1)

              print(
                  "Golf Post vastaa ja kaikki "
                  "viisi vertailupelaajaa loytyvat."
              )
              print(
                  "Seuraavaksi tarkistetaan "
                  "sijoitukset ja lyontimaarat."
              )

          except Exception as error:
              print("Tiedonhaku epaonnistui:", error)
              sys.exit(1)
          PY
