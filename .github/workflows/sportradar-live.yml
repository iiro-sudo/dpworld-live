
name: Sportradar Live Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sportradar-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update leaderboard
        env:
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import sys
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc)

          if os.environ.get("EVENT_NAME") == "schedule":
              if now.date().isoformat() != "2026-11-15":
                  print("Outside final day")
                  sys.exit(0)
              if not 5 <= now.hour < 20:
                  print("Outside update window")
                  sys.exit(0)

          key = os.environ.get("SPORTRADAR_API_KEY")
          if not key:
              sys.exit("Missing API key")

          tournament_id = "5cb4d159-8ee1-4239-b8cc-de4746e6d1d0"
          url = (
              "https://api.sportradar.com/golf/"
              "trial/euro/v3/en/2026/tournaments/"
              f"{tournament_id}/leaderboard.json"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "x-api-key": key,
                  "accept": "application/json"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          if data.get("id") != tournament_id:
              sys.exit("Wrong tournament")

          players = data.get("leaderboard")
          if not isinstance(players, list) or len(players) < 45:
              sys.exit("Invalid leaderboard")

          positions = {}
          for player in players:
              pos = player.get("position")
              if not isinstance(pos, int):
                  sys.exit("Invalid position")
              positions[pos] = positions.get(pos, 0) + 1

          aliases = {
              "Eugenio Lopez-Chacarra": "Eugenio Chacarra",
              "Jayden Trey Schaper": "Jayden Schaper",
              "Niklas Nørgaard Møller": "Niklas Nørgaard",
              "Angel Ayora Fanegas": "Angel Ayora"
          }

          result = []

          for player in players:
              first = player.get("first_name") or ""
              last = player.get("last_name") or ""
              name = player.get("name") or (
                  first + " " + last
              ).strip()

              if not name:
                  sys.exit("Missing player name")

              name = aliases.get(name, name)

              position = player["position"]
              score = player.get("score")
              strokes = player.get("strokes")

              if not isinstance(score, int):
                  sys.exit("Invalid score")
              if not isinstance(strokes, int) or strokes <= 0:
                  sys.exit("Invalid strokes")

              pos = str(position)
              if positions[position] > 1:
                  pos = "T" + pos

              if score == 0:
                  score_text = "E"
              elif score > 0:
                  score_text = "+" + str(score)
              else:
                  score_text = str(score)

              result.append({
                  "pos": pos,
                  "name": name,
                  "score": score_text,
                  "strokes": strokes
              })

          if len(set(p["name"] for p in result)) != len(result):
              sys.exit("Duplicate players")

          if not any(p["name"] == "Oliver Lindell" for p in result):
              sys.exit("Oliver Lindell missing")

          result.sort(
              key=lambda p: (
                  int(p["pos"].lstrip("T")),
                  p["name"]
              )
          )

          path = Path("snapshot.json")
          snapshot = json.loads(path.read_text(encoding="utf-8"))

          snapshot["players"] = result
          snapshot["date"] = now.date().isoformat()

          rounds = data.get("rounds", [])
          if isinstance(rounds, list):
              for r in rounds:
                  if not isinstance(r, dict):
                      continue
                  number = r.get("number")
                  status = str(r.get("status", "")).lower()
                  if (
                      isinstance(number, int)
                      and 1 <= number <= 4
                      and status in (
                          "inprogress", "in_progress",
                          "closed", "complete", "completed"
                      )
                  ):
                      snapshot["round"] = max(
                          int(snapshot.get("round", 3)),
                          number
                      )

          path.write_text(
              json.dumps(
                  snapshot,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print("Tournament:", data.get("name"))
          print("Players:", len(result))
          print("Round:", snapshot.get("round"))
          print("Oliver:", next(
              p for p in result
              if p["name"] == "Oliver Lindell"
          ))
          print("PGA ranking preserved:",
                len(snapshot.get("ranking", [])))
          PY

      - name: Calculate PGA card forecast
        run: |
          python3 - <<'PY'
          import json
          from korttiennuste import calculate, BASE_POINTS

          with open("snapshot.json", encoding="utf-8") as f:
              snapshot = json.load(f)

          forecast = calculate(
              snapshot["players"],
              BASE_POINTS
          )

          print("PGA card forecast - partial test")
          print("Players calculated:", len(forecast))

          for player in forecast:
              print(
                  player["rank"],
                  player["name"],
                  player["total_points"]
              )

          lindell = next(
              p for p in forecast
              if p["name"] == "Oliver Lindell"
          )

          print("Oliver partial ranking:", lindell["rank"])
          print(
              "WARNING: Incomplete starting points. "
              "Not publishing this ranking."
          )
          PY
          
      - name: Calculate PGA card forecast
        run: |
          python3 - <<'PY'
          import json
          from korttiennuste import calculate, BASE_POINTS

          with open("snapshot.json", encoding="utf-8") as f:
              snapshot = json.load(f)

          forecast = calculate(
              snapshot["players"],
              BASE_POINTS
          )

          print("PGA card forecast - partial test")
          print("Players calculated:", len(forecast))

          for player in forecast:
              print(
                  player["rank"],
                  player["name"],
                  player["total_points"]
              )

          lindell = next(
              p for p in forecast
              if p["name"] == "Oliver Lindell"
          )

          print("Oliver partial ranking:", lindell["rank"])
          print(
              "WARNING: Incomplete starting points. "
              "Not publishing this ranking."
          )
          PY


      
      - name: Commit updated results
        run: |
          if git diff --quiet -- snapshot.json; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add snapshot.json
          git commit -m "Update DP World Tour leaderboard"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

